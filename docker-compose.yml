version: "3.9"

services:
  backend:
    build:
      context: ./gyrofinance
    container_name: gyrofinance_api
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DATABASE_URL=sqlite:////data/gyrofinance.db
    volumes:
      - db_data:/data
    restart: unless-stopped

volumes:
  db_data:
